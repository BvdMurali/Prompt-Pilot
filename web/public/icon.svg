<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Define Gradients -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1324"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>

    <!-- Main "P" Logo Gradient -->
    <linearGradient id="pGrad" x1="50" y1="165" x2="160" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/> <!-- Violet/Purple -->
      <stop offset="40%" stop-color="#2563eb"/> <!-- Royal Blue -->
      <stop offset="75%" stop-color="#06b6d4"/> <!-- Cyan/Teal -->
      <stop offset="100%" stop-color="#22d3ee"/> <!-- Bright Sky Blue -->
    </linearGradient>

    <!-- Speed Lines Gradient (Purple to Blue) -->
    <linearGradient id="speedGrad" x1="10" y1="90" x2="70" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Dots Gradient -->
    <linearGradient id="dotsGrad" x1="80" y1="90" x2="125" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Subtle Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Square -->
  <rect width="200" height="200" rx="52" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border glow -->
  <rect x="2" y="2" width="196" height="196" rx="50" stroke="#1e293b" stroke-width="1.5" opacity="0.3"/>

  <!-- Background Light Glow Behind the Logo -->
  <circle cx="100" cy="100" r="60" fill="#0ea5e9" opacity="0.06" filter="url(#glow)"/>

  <!-- Speed Lines on the Left -->
  <!-- Top line (Row 1) -->
  <rect x="42" y="75" width="28" height="10" rx="5" fill="url(#speedGrad)"/>
  
  <!-- Middle lines (Row 2) -->
  <rect x="15" y="95" width="18" height="10" rx="5" fill="#7c3aed"/>
  <rect x="38" y="95" width="32" height="10" rx="5" fill="#2563eb"/>

  <!-- Bottom lines (Row 3) -->
  <rect x="15" y="115" width="10" height="8" rx="4" fill="#1d4ed8"/>
  <rect x="29" y="115" width="18" height="8" rx="4" fill="#2563eb"/>

  <!-- Three Dots inside the "P" Loop -->
  <circle cx="85" cy="100" r="5" fill="#7c3aed"/>
  <circle cx="102" cy="100" r="5" fill="#3b82f6"/>
  <circle cx="119" cy="100" r="5" fill="#0ea5e9"/>

  <!-- Main "P" Shape (Speech Bubble Path) -->
  <path d="
    M 70 42
    H 125
    C 158 42, 172 65, 172 90
    C 172 115, 158 138, 125 138
    H 80
    C 70 138, 62 148, 58 165
    C 61 146, 70 128, 76 114
    H 125
    C 140 114, 146 102, 146 90
    C 146 78, 140 66, 125 66
    H 70
    C 63 66, 63 42, 70 42
    Z" 
    fill="url(#pGrad)"
  />
</svg>
